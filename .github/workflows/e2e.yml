name: Pre-launch browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npm run lint && npm run test:e2e:typecheck
      - run: npm run test:e2e:ci
        env:
          CI: 'true'
      - name: Extended existing regression suites
        run: |
          npm run dev -- --host 127.0.0.1 --port 5191 --strictPort > /tmp/black-wall-e2e-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5191/ > /dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:5191 QA_SUITES=private-archive,privacy-failures,passphrase-recovery,media-sharing-locks,large-media,physical-interactions,ui-polish,help-guide,sound-state,room-motion,room-controls,shared-space,public-share,regression-edge-cases,security-input-matrix node ../qa/regression-all.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            web/playwright-report/
            web/test-results/
            /tmp/black-wall-regression-*/
            /tmp/black-wall-e2e-vite.log
          retention-days: 7
